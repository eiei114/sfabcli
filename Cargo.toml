[package]
name = "sfabcli"
version = "0.1.0"
edition = "2024"
# Verified floor: a transitive dependency (aes, via zip) needs 1.89.
rust-version = "1.89"
description = "CLI for Sketchfab that borrows your logged-in Chrome over CDP"
license = "MIT"
repository = "https://github.com/eiei114/sfabcli"
readme = "README.md"
authors = ["eiei114"]
keywords = ["sketchfab", "3d-assets", "cli", "cdp", "models"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
# Publish reviewed source and docs only, never local downloads or browser state.
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "src/**",
]

[[bin]]
name = "sfab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
ureq = { version = "3.5.1", features = ["json"] }
zip = "9.3.0"
