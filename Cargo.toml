[package]
name = "sfabcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "CLI for Sketchfab that borrows your logged-in Chrome over CDP"
license = "MIT"
repository = "https://github.com/eiei114/sfabcli"
readme = "README.md"
keywords = ["sketchfab", "3d-assets", "cli", "cdp"]
categories = ["command-line-utilities"]

[[bin]]
name = "sfab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
ureq = { version = "3.5.1", features = ["json"] }
zip = "9.3.0"
